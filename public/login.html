<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập · Giám sát gas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-card">
        <span class="brand-mark">G</span>
        <h1>Giám sát gas</h1>
        <p>Nhập mật khẩu để xem camera và cảnh báo.</p>
        <input type="password" id="pass-input" placeholder="Mật khẩu" autofocus>
        <button id="btn-login" class="chip chip-primary" type="button">Đăng nhập</button>
        <p id="error-msg" class="login-error hidden">Sai mật khẩu</p>
    </div>

    <script>
        const passInput = document.getElementById('pass-input');
        const errorMsg = document.getElementById('error-msg');

        async function login() {
            const pass = passInput.value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pass })
            });
            const data = await res.json();
            if (data.success) {
                document.cookie = `auth_token=${pass}; max-age=31536000; path=/`;
                window.location.href = '/';
            } else {
                errorMsg.classList.remove('hidden');
            }
        }

        document.getElementById('btn-login').addEventListener('click', login);
        passInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
