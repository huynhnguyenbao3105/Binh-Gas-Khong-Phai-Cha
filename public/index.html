<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giám sát bình gas</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark">G</span>
                <div>
                    <h1>Giám sát gas</h1>
                    <p id="status-text" class="status-safe">Chưa phát hiện bình gas</p>
                </div>
            </div>
            <div class="topbar-actions">
                <button id="btn-activate" class="chip" type="button" title="Cho phép trình duyệt phát còi khi cảm biến báo gas. Không phải tiếng camera.">Bật còi báo</button>
                <button id="btn-stop" class="chip chip-danger hidden" type="button">Tắt còi</button>
                <button id="btn-add-cam" class="chip" type="button">Thêm camera</button>
                <button id="btn-change-pass" class="chip chip-ghost" type="button">Mật khẩu</button>
            </div>
        </header>

        <main>
            <section class="camera-section">
                <div class="section-head">
                    <h2>Camera trực tiếp</h2>
                    <p class="hint">WebRTC · cấu hình trong config.json hoặc nút Thêm camera</p>
                </div>
                <div id="camera-grid" class="camera-grid"></div>
            </section>

            <section class="log-panel">
                <div class="log-header">
                    <h2>Nhật ký</h2>
                    <button id="btn-clear-log" class="chip chip-ghost" type="button">Xóa</button>
                </div>
                <ul id="log-list">
                    <li>Hệ thống sẵn sàng.</li>
                </ul>
            </section>
        </main>
    </div>

    <div id="cam-modal" class="modal hidden">
        <div class="modal-card">
            <h3 id="cam-modal-title">Thêm camera</h3>
            <form id="cam-form">
                <label>Tên hiển thị
                    <input type="text" id="cam-name" placeholder="Sân trước" required>
                </label>
                <label>ID / path MediaMTX
                    <input type="text" id="cam-id" placeholder="cam" pattern="[a-zA-Z0-9_-]+" required>
                </label>
                <label>Sensor ESP (cách nhau bởi dấu phẩy, để trống = mọi cảm biến)
                    <input type="text" id="cam-sensors" placeholder="esp32-1, kho-1">
                </label>
                <label class="check">
                    <input type="checkbox" id="cam-auto" checked>
                    Tự kết nối khi mở trang
                </label>
                <div class="modal-actions">
                    <button type="button" id="cam-modal-cancel" class="chip chip-ghost">Hủy</button>
                    <button type="submit" class="chip chip-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <audio id="siren-audio" loop preload="auto">
        <source src="siren.mp3" type="audio/mpeg">
    </audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
